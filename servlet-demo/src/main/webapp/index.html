<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crea WebDynamic Web Project</title>
    <style>
        /* Style général */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: #263238;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }
        header h1 {
            color: #2457a7;
            font-size: 32px;
            margin-bottom: 10px;
        }
        header p {
            color: #607080;
            font-size: 16px;
        }
        /* Cartes des formulaires */
        form {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #3976d2;
        }
        h2 {
            color: #2457a7;
            font-size: 21px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        /* Champ e-mail */
        input[type="email"],
        input[name="email"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            border: 1px solid #ccd5e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus,
        input[name="email"]:focus {
            outline: none;
            border-color: #3976d2;
            box-shadow: 0 0 5px rgba(57, 118, 210, 0.25);
        }

        /* Cases à cocher et boutons radio */
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0 20px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: #f2f6fc;
            border-radius: 8px;
            cursor: pointer;
            margin: 0;
            transition: background 0.3s;
        }
        .options label:hover {
            background: #e0eafc;
        }
        input[type="checkbox"],
        input[type="radio"] {
            accent-color: #3976d2;
            cursor: pointer;
            width: 17px;
            height: 17px;
        }
        /* Boutons */
        input[type="submit"] {
            background: #3976d2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        input[type="submit"]:hover {
            background: #2457a7;
            transform: translateY(-2px);
        }
        footer {
            text-align: center;
            margin-top: 35px;
            color: #607080;
            font-size: 13px;
        }
        footer a {
            color: #2457a7;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        /* Adaptation aux petits écrans */
        @media (max-width: 480px) {
            body {
                padding: 25px 12px;
            }
            header h1 {
                font-size: 25px;
            }
            form {
                padding: 20px;
            }
            .options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bienvenue !</h1>
            <p>Découvrez notre formulaire interactif</p>
        </header>
        <!-- Formulaire e-mail -->
        <form method="post" action="hello">
            <h2>📧 Votre adresse e-mail</h2>
            <label for="email">Entrez votre e-mail :</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="exemple@email.com"
                required
            >
            <input type="submit" value="Valider">
        </form>
        <!-- Formulaire ordinateur -->
        <form method="post" action="hello">
            <h2>💻 Votre ordinateur</h2>

            <p>Quel(s) micro-ordinateur(s) utilisez-vous ?</p>

            <div class="options">
                <label>
                    <input type="checkbox" name="ordi" value="mac">
                    Mac
                </label>
                <label>
                    <input type="checkbox" name="ordi" value="PC">
                    PC
                </label>
            </div>
            <input type="submit" value="Valider">
        </form>
        <!-- Formulaire média -->
        <form method="post" action="hello">
            <h2>💾 Média de distribution</h2>

            <p>Quel support préférez-vous ?</p>

            <div class="options">
                <label>
                    <input type="radio" name="media" value="USB" required>
                    Clé USB
                </label>
                <label>
                    <input type="radio" name="media" value="DVD">
                    DVD
                </label>
            </div>
            <input type="submit" value="Valider">
        </form>
        <footer>
            <p>
                <a href="https://www.skills4mind.com" target="_blank">
                    www.skills4mind.com
                </a>
            </p>
            <p>Made by Dr. Taha RIDENE</p>
        </footer>
    </div>
</body>
</html>
